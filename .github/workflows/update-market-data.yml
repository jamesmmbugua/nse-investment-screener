name: Refresh market data

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the Nairobi market close. GitHub schedules use UTC.
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public market data
        run: python scripts/collect_market_data.py

      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/update-status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: automated market refresh"
            git push
          fi
